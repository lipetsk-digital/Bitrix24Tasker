<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач Bitrix24</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <div class="header-section" id="header-left">
            <span>Список задач ✌</span>
            <span class="header-avatar" id="user-avatar" style="margin-left:10px;"></span>
            <button id="btn-add-task" class="btn-add-task" title="Создать задачу" style="display:none;">+</button>
        </div>
        <div class="header-divider"></div>
        <div class="header-section" id="header-center">
            <select id="mode-filter" class="header-select">
                <option value="fromme">Поручил</option>
                <option value="all">Участвую</option>
            </select>
            <select id="project-filter" class="header-select">
                <option value="all">Все проекты</option>
                <option value="none">Без проекта</option>
                <!-- Другие проекты будут добавлены динамически -->
            </select>
            <select id="view-mode" class="header-select">
                <option value="list">Список</option>
                <option value="inventory">Инвентаризация</option>
            </select>
            <select id="status-filter" class="header-select">
                <option value="active">В работе</option>
                <option value="control" selected>В работе и ждут контроля</option>
                <option value="all">Все задачи</option>
            </select>
        </div>
        <div class="header-divider"></div>
        <div class="header-section header-counters" id="header-right">
            <span>Загружено задач: <span id="loaded">0</span>, отобрано задач: <span id="count">0</span></span>
            <span id="spinner"><span class="spinner"></span></span>
            <button id="btn-refresh" class="btn-add-task" title="Обновить задачи">&#x27F3;</button>
        </div>
    </div>
    <div id="tasks"></div>
    <script src="/static/tasks.js"></script>
</body>
</html>
