<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка Bitrix24</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .setup-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 32px 28px;
            max-width: 480px;
            width: 100%;
        }
        .setup-card h1 {
            font-size: 18px;
            margin-bottom: 18px;
            text-align: center;
            color: #333;
        }
        .setup-card label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }
        .setup-card input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 18px;
            outline: none;
        }
        .setup-card input[type="text"]:focus {
            border-color: #4a90d9;
        }
        .setup-card button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .setup-card button:hover {
            background: #3a7bc8;
        }
    </style>
</head>
<body>
    <div class="setup-card">
        <h1>Настройка подключения к Bitrix24</h1>
        <label for="webhook-url">Введите URL точки присоединения к Bitrix24 (входящий WebHook)</label>
        <input type="text" id="webhook-url" placeholder="https://your-domain.bitrix24.ru/rest/1/abc123/"
               onkeydown="if(event.key==='Enter') document.getElementById('btn-save').click()">
        <button id="btn-save">Отправить</button>
    </div>
    <script>
        document.getElementById('btn-save').addEventListener('click', () => {
            let url = document.getElementById('webhook-url').value.trim();
            if (!url) return;
            if (!url.endsWith('/')) url += '/';
            const maxAge = 365 * 24 * 60 * 60; // 1 год
            document.cookie = `BITRIX_WEBHOOK=${encodeURI(url)}; path=/; max-age=${maxAge}; SameSite=Lax`;
            window.location.href = '/';
        });
    </script>
</body>
</html>
